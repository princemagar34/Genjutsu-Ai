name = "genjutsu"
main = "worker.js"
compatibility_date = "2024-01-01"

# Modern Workers Assets — replaces the old [site] + kv-asset-handler approach.
# Wrangler automatically binds env.ASSETS to serve files from this directory.
assets = { directory = "./" }

[vars]
BACKEND_HOST = "https://genjutsu-api.onrender.com"
# Public address of the backend. Browsers go here directly (no Worker proxy),
# so Render's Cloudflare bot check never sees a server-to-server request.
API_PUBLIC_HOST = "https://api.genjutsu.org"

# Keep the free Render backend awake: ping every 10 minutes (it sleeps after 15).
[triggers]
crons = ["*/10 * * * *"]
